name: Publicador Diario de Libros

on:
  schedule:
    - cron: '0 7 * * *' # Todos los días a las 2 AM (Perú)
  workflow_dispatch:     # Permite ejecutarlo manualmente

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install google-genai

      - name: Generar contenido con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Guardar y subir capítulo generado a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generación de capítulo" || exit 0
          git push
